plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = maven_group

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

base {
    archivesName = archives_name
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir { dirs 'libs' }
}

// ImageStream 提供 WebP / AVIF 解码（rip.ysm.imagestream.*）。
// 部分模型作者会把 WebP 字节直接写进 .png 文件并把 imageFormat 标成 2(PNG)，
// YSMClientMapper 探测到真签名后会改走 WebpDecoder，本依赖必须存在。
configurations {
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    compileOnly files('libs/ImageStream--SNAPSHOT.jar')
    bundle files('libs/ImageStream--SNAPSHOT.jar')
}

// 把 ImageStream 的类直接打进最终 jar，避免 jarJar 元数据与 flatDir 的兼容问题
jar {
    from(configurations.bundle.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/maven/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    def expandProps = [
            'version'               : mod_version,
            'mc_version'            : minecraft_version,
            'neoforge_version'      : neoforge_version,
            'mod_id'                : mod_id,
            'loader_version_range'  : loader_version_range,
            'neoforge_version_range': neoforge_version_range,
    ]

    inputs.properties expandProps

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}
